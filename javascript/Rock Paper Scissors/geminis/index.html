<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Rock Paper Scissors</h1>
        
        <div class="scoreboard">
            <div class="score">
                <span id="player-score">0</span>
                <p>Player</p>
            </div>
            <div class="score">
                <span id="computer-score">0</span>
                <p>Computer</p>
            </div>
        </div>

        <div class="display">
            <p id="message">Choose your weapon!</p>
            <div class="choices-preview">
                <span id="player-choice-display">-</span>
                <span>vs</span>
                <span id="computer-choice-display">-</span>
            </div>
        </div>

        <div class="controls">
            <button class="choice-btn" data-choice="rock">Rock</button>
            <button class="choice-btn" data-choice="paper">Paper</button>
            <button class="choice-btn" data-choice="scissors">Scissors</button>
        </div>

        <button id="reset-btn">Reset Game</button>
    </div>
    <script src="gamecode.js"></script>
</body>
</html>
